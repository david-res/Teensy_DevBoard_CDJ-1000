; https://docs.platformio.org/page/projectconf.html

[env:beermat_rev3]
platform_packages = platformio/framework-arduinoteensy @ symlink://../../framework-arduinoteensy-1.159
platform = teensy @ 5.0.0
board = teensymm
;lib_extra_dirs = ../../CDJ_Libs, ../../MyLibs      ; For LVGL 9
lib_extra_dirs = ../../CDJ_Libs                    ; For LVGL 8
lib_ignore = NativeEthernet
build_flags = ;-D LV_CONF_PATH="\"ian_lv_conf.h\""  ; For LVGL 9
              -D LV_CONF_INCLUDE_SIMPLE            ; For LVGL 8
              -D RDI_DEVELOPMENTS_REV3
              -D USB_DUAL_SERIAL
              ${common.build_flags}
board_build.f_cpu = 528000000L
monitor_port =  /dev/cu.usbmodem153596401  
board_build.ldscript = linkerScript/RDI_v6_saveITCM_heapSDRAM_setOCRAM_4M_8M_NOCACHE.ld   

[env:beermat_DB5]
platform_packages = platformio/framework-arduinoteensy @ symlink://../../framework-arduinoteensy-1.159
platform = teensy @ 5.0.0
board = teensymm
lib_extra_dirs = ../../CDJ_Libs, ../../MyLibs      ; For LVGL 9
